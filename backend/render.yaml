# Render deployment config for the Mini Store backend
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: mini-store-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGO_URI
        sync: false
        note: "Set your MongoDB Atlas connection string here"
      - key: JWT_SECRET
        sync: false
        note: "Set a secure random secret"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: CLIENT_URL
        value: https://mini-store-frontend.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Mini Store <onboarding@resend.dev>
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: PHONEPE_BASE_URL
        value: https://api-preprod.phonepe.com
      - key: PHONEPE_CLIENT_ID
        value: TEST
      - key: PHONEPE_CLIENT_VERSION
        value: "1"
      - key: PHONEPE_SALT_KEY
        value: TEST_SALT
      - key: PHONEPE_MERCHANT_ID
        value: TEST_MERCHANT